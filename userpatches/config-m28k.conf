# MangoPi M28K (RK3528) — 用 ./compile.sh m28k 调用本文件
# 配合 USERPATCHES_PATH=<SDK>/userpatches 使用

BOARD=mangopi-m28k
BRANCH=vendor               # 6.1.172 vendor 内核 (内含 hci_aic.c 蓝牙 serdev 驱动)
RELEASE=trixie
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
DOWNLOAD_MIRROR=cn
KERNEL_GIT=shallow
KERNEL_CONFIGURE=no
PREFER_DOCKER=no
INSTALL_HEADERS=yes         # 编 aic8800 外部模块需要内核头
SHARE_LOG=no
